name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-bundle
      - name: Download PDFium
        shell: bash
        run: |
          mkdir -p third_party/pdfium
          curl --proto '=https' --tlsv1.2 -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-arm64.tgz"
          tar xzf /tmp/pdfium.tgz -C third_party/pdfium
      - name: Bundle .app
        run: cargo bundle --release --format osx
      - name: Zip .app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/osx/presenters.app" presenters-macos-arm64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: presenters-macos-arm64.zip

  linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo install cargo-bundle
      - name: Download PDFium
        shell: bash
        run: |
          mkdir -p third_party/pdfium
          curl --proto '=https' --tlsv1.2 -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          tar xzf /tmp/pdfium.tgz -C third_party/pdfium
      - name: Bundle .deb
        run: cargo bundle --release --format deb
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/deb/*.deb

  windows:
    name: Windows portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download PDFium
        shell: bash
        run: |
          mkdir -p third_party/pdfium
          curl --proto '=https' --tlsv1.2 -sSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          tar xzf /tmp/pdfium.tgz -C third_party/pdfium
      - name: Build
        run: cargo build --release
      - name: Assemble portable zip
        shell: bash
        run: |
          mkdir -p dist/presenters
          cp target/release/rust-presenters.exe dist/presenters/presenters.exe
          cp third_party/pdfium/bin/pdfium.dll dist/presenters/
          cp README.md dist/presenters/ || true
          cp img/icon-256.png dist/presenters/ || true
          cd dist && 7z a ../presenters-windows-x64.zip presenters
      - uses: softprops/action-gh-release@v2
        with:
          files: presenters-windows-x64.zip
